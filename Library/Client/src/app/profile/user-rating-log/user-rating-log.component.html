<div class="rating-log-wrapper">
  <h3>Історія змін рейтингу</h3>
  <div *ngIf="isLoading" class="d-flex flex-column align-items-center mt-5">
    <div
      class="spinner-border text-secondary"
      role="status"
      style="width: 3rem; height: 3rem"
    >
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 text-muted">Завантаження рейтингу...</p>
  </div>

  <div *ngIf="ratingLogs.length > 0">
    <table class="rating-log-table">
      <thead>
        <tr>
          <th>Дата</th>
          <th>Зміна</th>
          <th>Причина</th>
          <th>Після зміни</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of ratingLogs">
          <td>{{ log.changedAt | date : "short" }}</td>
          <td
            [ngClass]="{
              positive: log.changeAmount > 0,
              negative: log.changeAmount < 0
            }"
          >
            {{ log.changeAmount > 0 ? "+" : ""
            }}{{ log.changeAmount.toFixed(2) }}
          </td>
          <td>{{ log.reason }}</td>
          <td>{{ log.ratingAfterChange.toFixed(2) }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!isLoading && this.ratingLogs.length == 0" class="no-results">
    Нічого не знайдено.
  </div>
</div>
