<section class="container-of-bookmarks">
  <div class="bookmarks-header">
    <input
      type="text"
      placeholder="Пошук за назвою..."
      [(ngModel)]="searchQuery"
      (input)="onSearchChange()"
      class="search-input"
    />
  </div>
  <div *ngIf="isLoading" class="d-flex flex-column align-items-center mt-5">
    <div
      class="spinner-border text-secondary"
      role="status"
      style="width: 3rem; height: 3rem"
    >
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 text-muted">Завантаження книг...</p>
  </div>

  <ul class="bookmarks" *ngIf="!isLoading">
    <app-novelties-item
      *ngFor="let noveltie of filteredBooks"
      [noveltie]="noveltie"
    ></app-novelties-item>
  </ul>

  <div *ngIf="!isLoading && this.bookmarksBook.length == 0" class="no-results">
    Нічого не знайдено.
  </div>
</section>
