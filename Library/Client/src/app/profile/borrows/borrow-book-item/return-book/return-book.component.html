<div class="backdrop" (click)="closeHandler()">
  <div class="modal" (click)="handleStopPropagation($event)">
    <header class="form-header"><h2>Продовження терміну</h2></header>
    <div class="form-body">
      <span class="verify-deletion"
        >Ви впевнені, що хочете повернути книгу?</span
      >
      <label for="condition">Оцініть стан книги:</label>
      <div class="custom-dropdown" (click)="toggleConditionDropdown()">
        <span>{{ selectedConditionLabel }}</span>
        <div class="arrow" [class.open]="conditionDropdownOpen"></div>
        <ul *ngIf="conditionDropdownOpen" class="custom-options">
          <li
            *ngFor="let option of conditionOptions"
            [class.selected]="option.value === condition"
            (click)="selectCondition(option.value, $event)"
          >
            {{ option.label }}
          </li>
        </ul>
      </div>
      <div class="actions">
        <button class="submit-button" (click)="returnBook()">Так</button>
        <button class="cancel-button" (click)="closeHandler()">Ні</button>
      </div>
    </div>
  </div>
</div>
