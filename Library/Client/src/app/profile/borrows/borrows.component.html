<section>
  <div class="btn-wrapper">
    <button *ngIf="isAdmin" class="borrow-btn" (click)="goToCreateBorrowing()">
      Додати позичення
    </button>
  </div>

  <div *ngIf="isLoading" class="d-flex flex-column align-items-center mt-5">
    <div
      class="spinner-border text-secondary"
      role="status"
      style="width: 3rem; height: 3rem"
    >
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 text-muted">Завантаження книг...</p>
  </div>

  <ul class="borrows">
    <app-borrow-book-item
      *ngFor="let borrowBook of borrowsBooks"
      [borrowBook]="borrowBook"
    ></app-borrow-book-item>
  </ul>

  <div *ngIf="!isLoading && this.borrowsBooks.length == 0" class="no-results">
    Нічого не знайдено.
  </div>
</section>
