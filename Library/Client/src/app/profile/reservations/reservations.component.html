<section class="container-of-reserved">
  <div *ngIf="isLoading" class="d-flex flex-column align-items-center mt-5">
    <div
      class="spinner-border text-secondary"
      role="status"
      style="width: 3rem; height: 3rem"
    >
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 text-muted">Завантаження книг...</p>
  </div>
  <ul class="reserved">
    <app-reservation-item
      *ngFor="let reservedBook of reservedBooks"
      [reservedBook]="reservedBook"
    ></app-reservation-item>
  </ul>

  <div *ngIf="!isLoading && this.reservedBooks.length == 0" class="no-results">
    Нічого не знайдено.
  </div>
</section>
