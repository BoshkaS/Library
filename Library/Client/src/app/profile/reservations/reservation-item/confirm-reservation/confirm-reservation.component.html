<div class="backdrop" (click)="closeHandler()">
  <div class="modal" (click)="handleStopPropagation($event)">
    <header class="form-header"><h2>Скасування резервації</h2></header>
    <div class="form-body">
      <span class="verify-deletion"
        >Ви впевнені, що хочете скасувати резервування книги?</span
      >
      <div class="actions">
        <button class="submit-button" (click)="cancelReservation()">Так</button>
        <button class="cancel-button" (click)="closeHandler()">Ні</button>
      </div>
    </div>
  </div>
</div>
