<div
  #dropdownDiv
  appDropdown
  tabindex="1"
  [class]="{ selector: true, extends }"
>
  <span *ngIf="values.length === 0" class="selector-placeholder"
    >{{ placeholder }}
  </span>
  <ul class="choice-list" *ngIf="values.length != 0">
    <li *ngFor="let value of values" class="choice-list-item">{{ value }}</li>
  </ul>

  <div appDropdownContent class="dropdown-content">
    <ng-content></ng-content>
  </div>
</div>
